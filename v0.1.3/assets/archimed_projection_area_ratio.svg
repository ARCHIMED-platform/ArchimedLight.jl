<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Projected area and area-ratio correction</title>
  <desc id="desc">ARCHIMED compares the true projected triangle area with the area of touched raster pixels, then uses their ratio to rescale pixel-based interception.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2f5145"/>
    </marker>
    <marker id="redArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L6 3 L0 6 Z" fill="#c8443c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172b24" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8faf7; }
      .panel { fill: #ffffff; stroke: #c8d5d0; stroke-width: 1.5; filter: url(#shadow); }
      .panelHead { fill: #eef6f1; }
      .title { font: 800 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #14352a; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4a6259; }
      .stage { font: 750 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #18372d; }
      .label { font: 650 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #28463d; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536960; }
      .tiny { font: 550 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f746d; }
      .math { font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243b33; }
      .mono { font: 650 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #2b4038; }
      .arrow { fill: none; stroke: #2f5145; stroke-width: 2.8; marker-end: url(#arrow); }
      .grid { stroke: #b8c6c0; stroke-width: 1; }
      .triangle { fill: #9cc7e6; fill-opacity: 0.64; stroke: #2b73b9; stroke-width: 2.6; }
      .triangleExact { fill: #8abf79; fill-opacity: 0.78; stroke: #22332a; stroke-width: 2.6; }
      .hit { fill: #f2c94c; fill-opacity: 0.7; stroke: #d0a928; stroke-width: 1; }
      .miss { fill: #f8fcfa; }
      .accent { fill: #e8f4ec; stroke: #9dc3a5; stroke-width: 1.3; }
      .blueBox { fill: #eef7ff; stroke: #9fbdd0; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="520"/>
  <path d="M0 0 H1200 V252 C1035 229 896 238 748 271 C606 303 476 320 321 293 C195 271 92 240 0 257 Z" fill="#eaf6fb"/>
  <path d="M0 420 C158 388 318 397 466 424 C620 452 774 452 922 417 C1020 394 1113 389 1200 406 V520 H0 Z" fill="#eef6e9"/>

  <text x="42" y="50" class="title">Projected area and area-ratio correction</text>
  <text x="44" y="78" class="subtitle">Rasterized pixels are convenient, but touched pixels can overestimate the true projected triangle area.</text>

  <line x1="382" y1="265" x2="430" y2="265" class="arrow"/>
  <line x1="774" y1="265" x2="822" y2="265" class="arrow"/>

  <g id="exact-panel" transform="translate(40 112)">
    <rect class="panel" x="0" y="0" width="342" height="342" rx="8"/>
    <rect class="panelHead" x="0" y="0" width="342" height="50" rx="8"/>
    <path class="panelHead" d="M0 40 H342 V58 H0 Z"/>
    <text x="18" y="32" class="stage">1. True projected area</text>

    <g transform="translate(35 72)">
      <line x1="8" y1="210" x2="272" y2="210" stroke="#7d8783" stroke-width="2"/>
      <text x="217" y="232" class="tiny">plot plane</text>

      <polygon points="62,42 234,7 180,126" class="triangleExact"/>
      <polygon points="54,163 234,128 145,191" class="triangle"/>

      <line x1="266" y1="30" x2="222" y2="84" stroke="#c8443c" stroke-width="2" marker-end="url(#redArrow)"/>
      <text x="248" y="24" class="tiny" fill="#c8443c">direction</text>
      <text x="8" y="118" class="label">triangle in scene</text>
      <text x="8" y="202" class="label">projected triangle</text>
    </g>

  </g>

  <g id="raster-panel" transform="translate(430 112)">
    <rect class="panel" x="0" y="0" width="342" height="342" rx="8"/>
    <rect class="panelHead" x="0" y="0" width="342" height="50" rx="8"/>
    <path class="panelHead" d="M0 40 H342 V58 H0 Z"/>
    <text x="18" y="32" class="stage">2. Touched raster pixels</text>

    <g transform="translate(66 76)">
      <rect x="0" y="0" width="210" height="210" rx="4" class="miss" stroke="#8dac9e" stroke-width="1.5"/>
      <g class="grid">
        <line x1="35" y1="0" x2="35" y2="210"/>
        <line x1="70" y1="0" x2="70" y2="210"/>
        <line x1="105" y1="0" x2="105" y2="210"/>
        <line x1="140" y1="0" x2="140" y2="210"/>
        <line x1="175" y1="0" x2="175" y2="210"/>
        <line x1="0" y1="35" x2="210" y2="35"/>
        <line x1="0" y1="70" x2="210" y2="70"/>
        <line x1="0" y1="105" x2="210" y2="105"/>
        <line x1="0" y1="140" x2="210" y2="140"/>
        <line x1="0" y1="175" x2="210" y2="175"/>
      </g>

      <rect x="35" y="35" width="35" height="35" class="hit"/>
      <rect x="70" y="35" width="35" height="35" class="hit"/>
      <rect x="105" y="35" width="35" height="35" class="hit"/>
      <rect x="140" y="35" width="35" height="35" class="hit"/>
      <rect x="35" y="70" width="35" height="35" class="hit"/>
      <rect x="70" y="70" width="35" height="35" class="hit"/>
      <rect x="105" y="70" width="35" height="35" class="hit"/>
      <rect x="140" y="70" width="35" height="35" class="hit"/>
      <rect x="35" y="105" width="35" height="35" class="hit"/>
      <rect x="70" y="105" width="35" height="35" class="hit"/>
      <rect x="105" y="105" width="35" height="35" class="hit"/>
      <rect x="70" y="140" width="35" height="35" class="hit"/>
      <rect x="105" y="140" width="35" height="35" class="hit"/>

      <polygon points="42,43 169,62 92,166" class="triangle"/>
      <text x="78" y="231" class="tiny">hit pixels</text>
    </g>

  </g>

  <g id="ratio-panel" transform="translate(822 112)">
    <rect class="panel" x="0" y="0" width="338" height="342" rx="8"/>
    <rect class="panelHead" x="0" y="0" width="338" height="50" rx="8"/>
    <path class="panelHead" d="M0 40 H338 V58 H0 Z"/>
    <text x="18" y="32" class="stage">3. Area-ratio correction</text>

    <g transform="translate(30 78)">
      <rect x="0" y="0" width="278" height="62" rx="6" class="accent"/>
      <text x="18" y="25" class="label">projected triangle area</text>
      <text x="18" y="47" class="small">from geometric projection</text>

      <rect x="0" y="82" width="278" height="62" rx="6" fill="#fffdf6" stroke="#d6c684" stroke-width="1.3"/>
      <text x="18" y="107" class="label">hit-pixel area</text>
      <text x="18" y="129" class="small">from touched raster pixels</text>

      <rect x="0" y="164" width="278" height="76" rx="6" fill="#f6fbf8" stroke="#c8d5d0" stroke-width="1.3"/>
      <text x="18" y="191" class="small">area ratio</text>
      <text x="18" y="213" class="mono">projected area / hit-pixel area</text>
      <text x="18" y="232" class="small">applied to visible area</text>
    </g>
  </g>
</svg>
